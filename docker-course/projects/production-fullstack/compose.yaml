name: docker-mastery-capstone

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/shop
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-net
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - edge-net

  mongo:
    image: mongo:7.0-jammy
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - internal-net

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  edge-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
