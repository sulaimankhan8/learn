name: Capstone CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/production-fullstack/backend
          load: true
          tags: capstone-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/production-fullstack/frontend
          load: true
          tags: capstone-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f ./projects/production-fullstack/compose.prod.yaml config
